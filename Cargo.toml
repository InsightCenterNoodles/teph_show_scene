[package]
name = "teph_show_scene"
version = "0.2.0"
edition = "2024"

[dependencies]
tephrite_rs = { git = "https://github.com/InsightCenterNoodles/tephrite_rs.git", rev = "49713c1b5d4731db38c74b88589a514196ec0eac" }
bevy = "0.18.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "*", features = ["derive"] }
toml = "0.9"

[patch.crates-io]
bevy = { git = "https://github.com/nicholasbl/bevy", branch = "cave_patches" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

